# THE LIVE COPY OF echo-session-brief. Runs scripts/echo-session-brief.py --write --notify
# from a public runner because private starfire-core Actions minutes are metered at 2,000
# a month and were spent by 2026-08-08T00:43Z (same reason as core-canon-drift.yml, full
# write-up in that file's header). The script is a no-op when no Echo booking is due, so
# firing it hourly costs almost nothing and the founder never opens a session cold.
#
# WHY HOURLY, NOT DAILY. The script's --hours-ahead default is 24, so a once-a-day run
# either lands more than 24 hours before every session or covers a shifting window that
# misses evening bookings scheduled after the run fires. Hourly with --hours-ahead 26
# guarantees a session that appears on the calendar at any time of day has its brief
# filed at least once before it starts, and the write is idempotent by design (a duplicate
# entry in echo_engagements.sessions is a harmless append the founder ignores; the real
# harm is a missing brief when he opens the call).
#
# WHY THE JOB IS QUIET. This log is public; the brief names private clients as it writes.
# The script writes its output to core/agent/echo-session-brief-last.log inside the private
# checkout and only prints the exit code here. Detail lives where it belongs.
#
# TASKS.md row SCHEDULE-THE-ECHO-SESSION-BRIEF-SO-NOBODY-HAS-TO-CALL-IT closes this.
name: echo-session-brief
on:
  schedule:
    - cron: "17 * * * *"   # :17 past every hour, out of the 05:10/05:30 canon-drift window
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: echo-session-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout starfire-core (the repository the script lives in)
        uses: actions/checkout@v4
        with:
          repository: BetterSocieties/starfire-core
          token: ${{ secrets.GH_PAT }}
          path: core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fire the brief for any Echo booking inside the next 26 hours
        working-directory: core
        env:
          # THE SECRET NAMES WERE WRONG AND THIS JOB HAD NEVER ONCE WORKED. Fixed
          # 2026-08-21 after reading all 7 runs since the job was created: every one
          # failed, and the log of run 32429431385 prints both of these as EMPTY,
          # followed by exit=2 and "the credential store did not answer". This repo has
          # no secret called STARFIRE_VAULT_BEARER and none called STARFIRE_VAULT_URL.
          # The bearer it really holds is VAULT_BEARER, proved rather than assumed: the
          # sibling job sync-pod-key-to-vault reads secrets.VAULT_BEARER, exits 1 the
          # moment it is empty, and its one run succeeded on 2026-07-19. The URL is not
          # a secret at all, which is why that same sibling writes the host inline, and
          # canon says so in as many words, so it is set here rather than referenced.
          STARFIRE_VAULT_URL: https://starfire-vault.dark-wildflower-46d6.workers.dev
          STARFIRE_VAULT_BEARER: ${{ secrets.VAULT_BEARER }}
        run: |
          mkdir -p agent
          rc=0; python3 scripts/echo-session-brief.py --hours-ahead 26 --write --notify \
            > agent/echo-session-brief-last.log 2>&1 || rc=$?
          # THE REAL DEFECT, found 2026-09-04: the script's own message is byte-identical
          # on every run that finds nothing due ("no Echo session starts in the next 26.0
          # hours..."), so the commit step below always saw "no change in brief log" and
          # never committed. 37 green runs in 7 days looked exactly like the job silently
          # dying, because a run that fired correctly and a run that never fired at all
          # left the same trace: nothing new in git. Read live 2026-09-04: echo_engagements
          # holds 0 rows (Echo Studio has closed no client yet, confirmed against
          # ventures/echo-studio/CONFIRMED-CLIENTS.md and CANONICAL-FACTS.md), the account's
          # two Echo Cal.com event types (6230079, 6061711) are still the live ones, and a
          # synthetic engagement pushed through --engagement/--write/--notify wrote a real
          # sessions.jsonb entry and posted to Slack successfully, then was deleted. So the
          # script is correct and was correctly finding nothing to do; the gap was that
          # "correctly idle" and "stopped running" were indistinguishable from outside it.
          # A run id and a UTC timestamp, appended after the script's own output, make every
          # real run change the file, so the commit step fires every time and a stale log
          # becomes visible instead of silently looking identical to a fresh one.
          {
            echo ""
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ) run=${{ github.run_id }} exit=$rc"
          } >> agent/echo-session-brief-last.log
          echo "exit=$rc"
          # Print only the last line, which is either the no-brief message or the slack sent line.
          tail -2 agent/echo-session-brief-last.log | head -1 | cut -c1-160
          exit $rc

      - name: Commit the last log so a fire can see whether this actually ran
        if: always()
        working-directory: core
        run: |
          git config user.name "starfire-echo-session-brief"
          git config user.email "info@bettersocieties.world"
          git add agent/echo-session-brief-last.log || true
          if git diff --cached --quiet; then echo "no change in brief log"; exit 0; fi
          git commit -m "echo-session-brief: last run from public runner ${{ github.run_id }}"
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0 || { git fetch origin main && git rebase origin/main || git rebase --abort; }
          done
          echo "push failed after 5 attempts" >&2; exit 1
