name: sgtl-welcome-sender-hourly
# The Workers Free plan has no spare cron triggers, so this public repo's free minutes call the Worker each hour.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: sgtl-welcome-sender
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send today's welcome emails
        env:
          TOKEN: ${{ secrets.SGTL_WELCOME_RUN_TOKEN }}
        run: |
          code=$(curl -sS --max-time 60 -o out.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            https://sgtl-welcome-sender.dark-wildflower-46d6.workers.dev/run)
          cat out.json; echo
          test "$code" = "200"
