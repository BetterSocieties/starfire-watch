# Report in Slack, once a day, which scheduled jobs failed.
#
# It exists to let GitHub's own run-failure email be switched off. That email
# sent 276 messages in 21 days to an inbox nobody reads, one per failed run, so
# 22 failures of a single job arrived as 22 separate notices. This sends one
# message grouped by job, and sends nothing at all on a day when nothing failed.
#
# It lives in starfire-watch rather than starfire-core because the report covers
# BOTH repos and a workflow's built-in token can only read its own. This repo
# already holds GH_PAT, which reads across them. The script itself stays in
# starfire-core, where it is maintained; this job checks that repo out and runs
# it, so there is one copy of the logic rather than two that drift apart.
#
# 22:00 UTC is 07:00 in Tokyo: it arrives with the morning, not at midnight.
name: actions-failure-report

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the script from starfire-core
        uses: actions/checkout@v4
        with:
          repository: BetterSocieties/starfire-core
          token: ${{ secrets.CORE_READ_TOKEN }}
          # FIVE paths, and the count keeps rising for the same reason each
          # time: this list is a hand-copied dependency graph and the graph
          # moves. The digest reports failures; the checker and its registry
          # are the half that notices a job which stopped running at all; the
          # checker in turn loads ec-ops-scheduled-task-audit.py for
          # compute_task_health, so a list that stops at the checker fetches a
          # file that cannot import.
          # Run 31128804772 proved exactly that: every path present, every
          # path readable, and still "the silent-job check did not run".
          #
          # scripts/lib/load_by_path.py is the FIFTH, added 2026-09-12 on card
          # 4032 after five nights of total silence. Both
          # report-actions-failures-to-slack.py (line 71) and
          # check-scheduled-jobs-alive.py (line 56) import load_by_path off
          # scripts/lib, so leaving it out did NOT degrade the digest, it
          # stopped the run dead at import with ModuleNotFoundError before a
          # single line of the report was built. That module imports only the
          # standard library, so this closes the graph.
          #
          # Guarded by scripts/tests/test-digest-runner-layout.py, which stands
          # this exact file list up in an empty tree and refuses a list that
          # cannot load. That guard passed all five of those nights and was
          # itself repaired on the same card: it read this file only through
          # gh, which a cloud fire does not have, and exited 2 NOT CONFIGURED
          # having checked nothing; and it imported load_by_path itself, so the
          # digest under test resolved the import from the parent process
          # rather than the temp tree. Do not remove a path from this list on
          # the strength of that guard being green without first running it
          # where it can actually read this file.
          sparse-checkout: |
            scripts/report-actions-failures-to-slack.py
            scripts/lib/load_by_path.py
            scripts/check-scheduled-jobs-alive.py
            scripts/ec-ops-scheduled-task-audit.py
            ops/scheduled-jobs-registry.json
          sparse-checkout-cone-mode: false

      - name: Post the digest to Slack
        env:
          # The built-in token cannot read the other repo. GH_PAT can, and the
          # script names any repo it was refused rather than quietly reporting
          # half the failures as though they were all of them.
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python3 scripts/report-actions-failures-to-slack.py --hours 24
