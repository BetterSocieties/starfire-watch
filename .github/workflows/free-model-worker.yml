# Free-model swarm worker: proves and provides mechanical AI work in the cloud
# with 0 Claude tokens. Runs the llm-router (lives in starfire-core) against the
# free tiers (Groq, Gemini, OpenRouter) and commits a dated receipt here so any
# session can verify the swarm is alive without trusting anyone's word.
# 2026-08-01: GitHub Models was retired by GitHub on 2026-07-30, so workers carry
# provider keys as Action secrets instead.
#
# 2026-08-13, row FREE-MODEL-WORKER-SENDS-A-CHANGELOG-FULL-OF-MAILBOXES-TO-A-FREE-MODEL.
# This job had failed EVERY hourly run for days and only a mailbox noticed. The
# cause was its own task: it piped the first 40 lines of ops/CHANGELOG.md into the
# router, that changelog is a live business document that names mailboxes, and the
# router refuses a personal detail before it makes any request. So the step raised
# and the run died in 18 to 21 seconds, which is 2 checkouts and a Python setup,
# with the work never starting. The rail is correct and was not touched. The input
# is now built by core/scripts/free-model-worker-prompt.py, which redacts with the
# router's OWN patterns and then asks the router whether what it produced would be
# accepted, so the prompt is clean by construction rather than clean by luck.
name: free-model-worker
on:
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch: {}

concurrency:
  group: free-model-worker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  work:
    runs-on: ubuntu-latest
    # This job had no timeout, so a free provider that accepted a connection and
    # then went quiet could hold a runner for the platform default of 6 hours.
    timeout-minutes: 10
    steps:
      - name: Checkout starfire-watch
        uses: actions/checkout@v4
      - name: Checkout starfire-core (router + changelog)
        uses: actions/checkout@v4
        with:
          repository: BetterSocieties/starfire-core
          token: ${{ secrets.GH_PAT }}
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Router self-test on free tiers
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 core/scripts/llm-router.py --self-test
      - name: Prove the prompt builder still holds its own rail
        run: python3 core/scripts/free-model-worker-prompt.py --self-test
      - name: 1 real mechanical task on a free model
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -e
          mkdir -p data/free-model-receipts
          python3 core/scripts/free-model-worker-prompt.py \
            --changelog core/ops/CHANGELOG.md \
            --out data/free-model-receipts/last-prompt.txt
          # The router's own stderr is the ONLY evidence of why a free route failed,
          # and it went to a file that the following cat printed. Under set -e a
          # router failure skipped that cat, so this job failed 34 times in a row
          # between 2026-08-30 and 2026-09-04 leaving no reason anywhere a reader
          # could reach. Capture the exit code, always print the reasoning, then fail.
          rc=0
          python3 core/scripts/llm-router.py --task bulk --max-tokens 400 \
            --caller free-model-worker \
            --prompt-file data/free-model-receipts/last-prompt.txt \
            2> data/free-model-receipts/last-route.txt \
            > data/free-model-receipts/last-summary.txt || rc=$?
          echo "----- router stderr -----"
          cat data/free-model-receipts/last-route.txt || true
          echo "----- router stdout -----"
          cat data/free-model-receipts/last-summary.txt || true
          if [ "$rc" -ne 0 ]; then
            echo "the router exited $rc, reasoning above"
            exit "$rc"
          fi
          date -u +%Y-%m-%dT%H:%M:%SZ > data/free-model-receipts/last-run.txt
      - name: Commit the receipt
        run: |
          git config user.name "starfire-free-model-worker"
          git config user.email "actions@users.noreply.github.com"
          git add data/free-model-receipts
          git commit -m "free-model worker receipt: $(cat data/free-model-receipts/last-run.txt)" || exit 0
          # The old loop was `for ...; do git push && break || git pull --rebase; done`,
          # which exits with the status of the LAST git pull, so 5 lost races reported
          # success and the receipt was silently dropped. Fail out loud instead.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push_ok attempt=$i"
              exit 0
            fi
            git pull --rebase
            sleep $i
          done
          echo "push_failed after 5 attempts"
          exit 1
