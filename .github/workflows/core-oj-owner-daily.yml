# OpsJuice Stage 0 workflow 1, puts an owner name and the owner's own mailbox on every screened prospect;
# runs at 07:40 UTC daily, after the 05:00 UTC source chain (see SCHEDULE).
#
# WHY THIS IS ITS OWN WORKFLOW. The owner name/email step used to be part of core-oj-source-daily, so a
# failure in any earlier source step (Overture, site read, stamp) skipped it, and core-oj-verify-daily
# (`needs: source`) was skipped with it. Source failed 2026-10-14, 10-15 and 10-16; verify last ran
# 2026-10-12. Now it has two entry points, both running the one copy of the steps below:
#   1. This file's own cron, at 07:40 UTC daily, after the 05:00 source chain, so a failed source run
#      no longer stops rows that already exist from getting an owner.
#   2. workflow_dispatch.
# How many rows are owed an owner, and so how many days the daily batch (500 names, 200 mailboxes) takes
# to clear them, is measured on the first dispatch run after the 00:00 UTC D1 reset and written here.
#
# D1 SINCE 2026-10-30. Supabase was shut off 2026-10-25; every step here reads and writes Cloudflare D1
# (core PR 5730, scripts/oj_d1.py), with the token fetched from the vault into CLOUDFLARE_API_TOKEN.
#
# SCHEDULE. GitHub documents that `schedule` runs only from the default branch, is in UTC, can be
# delayed at high load (the start of every hour is the busiest), and is disabled in a public repository
# after 60 days without repository activity
# (docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule).
# So the minute is :40, not :00. core-oj-source-daily's own runs have started between 09:34 and 12:31
# UTC against a 05:00 cron on 2026-10-13 to 10-16, so this daily run sits at 07:40, well before the
# 10:17 screen and 11:17 verify.
#
# CONCURRENCY. `group: core-oj-owner-daily` with cancel-in-progress false: at most one run and one
# pending run per group, a newer pending run replaces an older pending one, and a running owner
# job is never cancelled halfway through its writes
# (docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency).
# A cron run that lands while a dispatch run is still writing waits, then picks up only the rows still owed.
#
# READ BUDGET. D1's free tier allows 5,000,000 rows read a day for the whole OJ account, reset at 00:00 UTC
# (developers.cloudflare.com/d1/platform/pricing/). On 2026-10-30 the hourly catch-up of these steps read
# about 2.9 million of them and the account hit the limit (error 7500) at about 04:50 UTC, which stops
# every OJ query, the sender included. This job's own read and write cost is not measured yet; it is
# measured with scripts/oj-d1-usage.py around the first dispatch run and written here. Do not raise the
# cadence or the batch sizes before that.
#
# THE LOG AND THE STEP SUMMARY ARE WORLD READABLE. Both carry counts only; which businesses passed is on D1.
name: core-oj-owner-daily
on:
  schedule:
    - cron: "40 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: core-oj-owner-daily
  cancel-in-progress: false

# The Actions log of this public repo is world readable. A failure tail prints only lines shaped like an
# error or a count summary; any other line (a business name, a site, a city) is dropped before printing.
env:
  SAFE_LINES: '^(Traceback|  File "|[A-Za-z0-9_.]*(Error|Exception|Exit)\b|(error|fatal|warning)\b|exit=|HTTP [0-9]|D1 statements|refused:|write failed:|usage: |[A-Za-z0-9_.-]+\.py: error:)'

jobs:
  owner:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STARFIRE_VAULT_URL: https://starfire-vault.dark-wildflower-46d6.workers.dev
      STARFIRE_VAULT_BEARER: ${{ secrets.VAULT_BEARER }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout starfire-core (the repository the scripts live in)
        uses: actions/checkout@v4
        with:
          repository: BetterSocieties/starfire-core
          token: ${{ secrets.GH_PAT }}
          path: core
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Name the owner from the prospect's own site and listing, 500 a run
        working-directory: core
        run: |
          set -uo pipefail
          rc=0
          timeout 1500 python3 scripts/vault-get.py CLOUDFLARE_CODEMODE_MCP_TOKEN --into CLOUDFLARE_API_TOKEN -- \
            python3 scripts/oj-find-owner-name.py --batch 500 --max-seconds 1380 --apply > "$RUNNER_TEMP/owner-name.log" 2>&1 || rc=$?
          echo "owner name exit=$rc"
          grep -E '^\{' "$RUNNER_TEMP/owner-name.log" | tail -n 1 || true
          # The script writes every 25 rows and stops itself at 1380 s (core PR 5902), so a timeout (124)
          # means it overran its own clock: a failure, not a normal end.
          if [ "$rc" -ne 0 ]; then
            tail -n 3 "$RUNNER_TEMP/owner-name.log" | { grep -E "$SAFE_LINES" || true; } | sed -E 's/[[:alnum:]._+-]+@[[:alnum:].-]+/[address]/g'
            exit "$rc"
          fi

      - name: Find the named owner's own mailbox, 200 a run
        if: ${{ !cancelled() }}
        working-directory: core
        run: |
          set -uo pipefail
          rc=0
          timeout 1620 python3 scripts/vault-get.py CLOUDFLARE_CODEMODE_MCP_TOKEN --into CLOUDFLARE_API_TOKEN -- \
            python3 scripts/oj-find-owner-email.py --batch 200 --max-seconds 1500 --apply > "$RUNNER_TEMP/owner-email.log" 2>&1 || rc=$?
          echo "owner email exit=$rc"
          grep -E '^\{' "$RUNNER_TEMP/owner-email.log" | tail -n 1 || true
          if [ "$rc" -ne 0 ]; then
            tail -n 3 "$RUNNER_TEMP/owner-email.log" | { grep -E "$SAFE_LINES" || true; } | sed -E 's/[[:alnum:]._+-]+@[[:alnum:].-]+/[address]/g'
            exit "$rc"
          fi
