# OpsJuice Stage 0 workflow 1, puts an owner name and the owner's own mailbox on every screened prospect;
# runs at 07:40 UTC daily, after the 05:00 UTC source chain (see SCHEDULE).
#
# WHY THIS IS ITS OWN WORKFLOW. The owner name/email step used to be part of core-oj-source-daily, so a
# failure in any earlier source step (Overture, site read, stamp) skipped it, and core-oj-verify-daily
# (`needs: source`) was skipped with it. Source failed 2026-10-14, 10-15 and 10-16; verify last ran
# 2026-10-12. Now it has two entry points, both running the one copy of the steps below:
#   1. This file's own cron, at 07:40 UTC daily, after the 05:00 source chain, so a failed source run
#      no longer stops rows that already exist from getting an owner.
#   2. workflow_dispatch.
# How many rows are owed an owner, and so how many days the daily batch (500 names, 200 mailboxes) takes
# to clear them, is measured on the first dispatch run after the 00:00 UTC D1 reset and written here.
#
# D1 SINCE 2026-10-30. Supabase was shut off 2026-10-25; every step here reads and writes Cloudflare D1
# (core PR 5730, scripts/oj_d1.py), with the token fetched from the vault into CLOUDFLARE_API_TOKEN.
#
# SCHEDULE. GitHub documents that `schedule` runs only from the default branch, is in UTC, can be
# delayed at high load (the start of every hour is the busiest), and is disabled in a public repository
# after 60 days without repository activity
# (docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule).
# So the minute is :40, not :00. core-oj-source-daily's own runs have started between 09:34 and 12:31
# UTC against a 05:00 cron on 2026-10-13 to 10-16, so this daily run sits at 07:40, well before the
# 10:17 screen and 11:17 verify.
#
# CONCURRENCY. `group: core-oj-owner-daily` with cancel-in-progress false: at most one run and one
# pending run per group, a newer pending run replaces an older pending one, and a running owner
# job is never cancelled halfway through its writes
# (docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency).
# A cron run that lands while a dispatch run is still writing waits, then picks up only the rows still owed.
#
# READ BUDGET. D1's free tier allows 5,000,000 rows read a day for the whole OJ account, reset at 00:00 UTC
# (developers.cloudflare.com/d1/platform/pricing/). On 2026-10-30 the hourly catch-up of these steps read
# about 2.9 million of them and the account hit the limit (error 7500) at about 04:50 UTC, which stops
# every OJ query, the sender included. This job's own read and write cost is not measured yet; it is
# measured with scripts/oj-d1-usage.py around the first dispatch run and written here. Do not raise the
# cadence or the batch sizes before that.
#
# THE LOG AND THE STEP SUMMARY ARE WORLD READABLE. Both carry counts only; which businesses passed is on D1.
name: core-oj-owner-daily
on:
  schedule:
    - cron: "40 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: core-oj-owner-daily
  cancel-in-progress: false

# The Actions log of this public repo is world readable. A failure tail prints only lines shaped like an
# error or a count summary; any other line (a business name, a site, a city) is dropped before printing.
env:
  SAFE_LINES: '^(Traceback|  File "|[A-Za-z0-9_.]*(Error|Exception|Exit)\b|(error|fatal|warning)\b|exit=|HTTP [0-9]|D1 statements|found=|refused:|write failed:|usage: |[A-Za-z0-9_.-]+\.py: error:)'

jobs:
  owner:
    needs: registries
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STARFIRE_VAULT_URL: https://starfire-vault.dark-wildflower-46d6.workers.dev
      STARFIRE_VAULT_BEARER: ${{ secrets.VAULT_BEARER }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout starfire-core (the repository the scripts live in)
        uses: actions/checkout@v4
        with:
          repository: BetterSocieties/starfire-core
          ref: main
          token: ${{ secrets.GH_PAT }}
          path: core
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Name the owner from the prospect's own site and listing, 500 a run
        working-directory: core
        run: |
          set -uo pipefail
          rc=0
          timeout 1500 python3 scripts/vault-get.py CLOUDFLARE_CODEMODE_MCP_TOKEN --into CLOUDFLARE_API_TOKEN -- \
            bash -c 'exec python3 scripts/oj-find-owner-name.py --batch 500 --max-seconds 1380 --apply > "$RUNNER_TEMP/owner-name.log" 2>&1' || rc=$?
          echo "owner name exit=$rc"
          awk '/^\{/{l=$0} END{if(l)print l}' "$RUNNER_TEMP/owner-name.log"
          # The script writes every 25 rows and stops itself at 1380 s (core PR 5902), so a timeout (124)
          # means it overran its own clock: a failure, not a normal end.
          if [ "$rc" -ne 0 ]; then
            tail -n 3 "$RUNNER_TEMP/owner-name.log" | { grep -E "$SAFE_LINES" || true; } | sed -E 's/[[:alnum:]._+-]+@[[:alnum:].-]+/[address]/g'
            exit "$rc"
          fi

      - name: Install Reacher, the mailbox prober the next step needs
        if: ${{ !cancelled() }}
        working-directory: core
        env:
          GH_TOKEN: ${{ github.token }}
          REACHER_BIN_DIR: ${{ runner.temp }}/reacher
        run: bash scripts/install-reacher.sh

      - name: Find the named owner's own mailbox, 200 a run
        if: ${{ !cancelled() }}
        working-directory: core
        env:
          REACHER_BIN: ${{ runner.temp }}/reacher/check_if_email_exists
        run: |
          set -uo pipefail
          # A missing prober would stamp every row unknown and still exit 0, so refuse the run instead.
          test -x "$REACHER_BIN" || { echo "error: Reacher is not installed"; exit 1; }
          rc=0
          timeout 1620 python3 scripts/vault-get.py CLOUDFLARE_CODEMODE_MCP_TOKEN --into CLOUDFLARE_API_TOKEN -- \
            bash -c 'exec python3 scripts/oj-find-owner-email.py --batch 200 --max-seconds 1500 --apply > "$RUNNER_TEMP/owner-email.log" 2>&1' || rc=$?
          echo "owner email exit=$rc"
          awk '/^\{/{l=$0} END{if(l)print l}' "$RUNNER_TEMP/owner-email.log"
          if [ "$rc" -ne 0 ]; then
            tail -n 3 "$RUNNER_TEMP/owner-email.log" | { grep -E "$SAFE_LINES" || true; } | sed -E 's/[[:alnum:]._+-]+@[[:alnum:].-]+/[address]/g'
            exit "$rc"
          fi

  # A second source of owner names, from the state registers rather than the prospect's own site:
  # the Florida DBPR construction-licence extract, the Arizona Registrar of Contractors, and the
  # Florida Division of Corporations (Sunbiz) quarterly extracts. It has its own checkout, its own
  # D1 token, and runs before the owner job (the owner job declares needs: registries). Each source
  # step carries continue-on-error so one register being down does not stop the others. The log and
  # the step summary are world readable: counts only, never a business name.
  registries:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      STARFIRE_VAULT_URL: https://starfire-vault.dark-wildflower-46d6.workers.dev
      STARFIRE_VAULT_BEARER: ${{ secrets.VAULT_BEARER }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUNBIZ_SFTP_USER: Public
      SUNBIZ_SFTP_PASS: "PubAccess1845!"
      # the state's sftp host keys, pinned; a change fails the download instead of trusting it.
      # read with ssh-keyscan on 2026-11-06 (ECDSA, RSA, ED25519; SHA256 TPtpEBn4, Uv7WZDtG, xTpc6X81)
      SUNBIZ_KNOWN_HOSTS: |
        sftp.floridados.gov ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBEoTyT4Kp6MNXcKhRwwN5Je/j7HAwtWvhXKT41h0x8l0SWEuPnh0QfhMHXMMhxvAItK5y/CoUZBTeO8aVmGJ/TE=
        sftp.floridados.gov ssh-rsa 
        sftp.floridados.gov ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIFRdq4ekBu4hkT7QRm+frcyLZFQZplBp63gRcEm0Kwq
    steps:
      - name: Checkout starfire-core (the repository the scripts live in)
        uses: actions/checkout@v4
        with:
          repository: BetterSocieties/starfire-core
          ref: main
          token: ${{ secrets.GH_PAT }}
          path: core
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Name the owner from the Florida DBPR construction-licence extract, 200 a run
        continue-on-error: true
        working-directory: core
        run: |
          set -uo pipefail
          dl_rc=0
          curl -fsSL --retry 3 --max-time 300 --connect-timeout 20 -o "$RUNNER_TEMP/fl-dbpr.csv" https://www2.myfloridalicense.com/sto/file_download/extracts/CONSTRUCTIONLICENSE_1.csv || dl_rc=$?
          if [ "$dl_rc" -ne 0 ]; then
            echo "fl-dbpr download exit=$dl_rc"
            exit "$dl_rc"
          fi
          rc=0
          python3 scripts/vault-get.py CLOUDFLARE_CODEMODE_MCP_TOKEN --into CLOUDFLARE_API_TOKEN -- \
            bash -c 'exec timeout 600 python3 scripts/oj-owner-from-fl-dbpr.py --file "$RUNNER_TEMP/fl-dbpr.csv" --limit 200 --apply > "$RUNNER_TEMP/fl-dbpr.log" 2>&1' || rc=$?
          echo "fl-dbpr exit=$rc"
          python3 - "$RUNNER_TEMP/fl-dbpr.log" <<'PY'
          import json, sys
          line = ""
          for raw in open(sys.argv[1]):
              if raw.startswith("{"):
                  line = raw
          try:
              d = json.loads(line)
          except Exception:
              print(json.dumps({"unparsed": 1}))
              sys.exit(0)
          out = {}
          for k, v in d.items():
              if isinstance(v, bool):
                  continue
              if isinstance(v, (int, float)):
                  out[k] = v
              elif k == "by_confidence" and isinstance(v, dict) and all(isinstance(sv, int) and not isinstance(sv, bool) for sv in v.values()):
                  for sk, sv in v.items():
                      out[f"{k}_{sk}"] = sv
          print(json.dumps(out))
          PY
          if [ "$rc" -ne 0 ]; then
            tail -n 3 "$RUNNER_TEMP/fl-dbpr.log" | { grep -E "$SAFE_LINES" || true; } | sed -E 's/[[:alnum:]._+-]+@[[:alnum:].-]+/[address]/g'
            exit "$rc"
          fi
          exit "$rc"

      - name: Name the owner from the Arizona Registrar of Contractors, 200 a run
        continue-on-error: true
        working-directory: core
        run: |
          set -uo pipefail
          rc=0
          python3 scripts/vault-get.py CLOUDFLARE_CODEMODE_MCP_TOKEN --into CLOUDFLARE_API_TOKEN -- \
            bash -c 'exec timeout 900 python3 scripts/oj-owner-from-az-roc.py --limit 200 --apply --cache "$RUNNER_TEMP/az-roc-cache.json" > "$RUNNER_TEMP/az-roc.log" 2>&1' || rc=$?
          echo "az-roc exit=$rc"
          python3 - "$RUNNER_TEMP/az-roc.log" <<'PY'
          import json, sys
          line = ""
          for raw in open(sys.argv[1]):
              if raw.startswith("{"):
                  line = raw
          try:
              d = json.loads(line)
          except Exception:
              print(json.dumps({"unparsed": 1}))
              sys.exit(0)
          out = {}
          for k, v in d.items():
              if isinstance(v, bool):
                  continue
              if isinstance(v, (int, float)):
                  out[k] = v
              elif k == "by_confidence" and isinstance(v, dict) and all(isinstance(sv, int) and not isinstance(sv, bool) for sv in v.values()):
                  for sk, sv in v.items():
                      out[f"{k}_{sk}"] = sv
          print(json.dumps(out))
          PY
          if [ "$rc" -ne 0 ]; then
            tail -n 3 "$RUNNER_TEMP/az-roc.log" | { grep -E "$SAFE_LINES" || true; } | sed -E 's/[[:alnum:]._+-]+@[[:alnum:].-]+/[address]/g'
            exit "$rc"
          fi
          exit "$rc"

      # The cache key is the hash of the state's own directory listing, so a file the state posts late in the quarter is fetched again.
      - name: Pin the state's sftp host keys
        run: |
          mkdir -p ~/.ssh ~/sunbiz
          printf '%s\n' "$SUNBIZ_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Read the state's own file dates
        id: stamp
        run: |
          set -uo pipefail
          rc=0
          listing=""
          for d in fic cor; do
            body=$(curl -fsS --max-time 60 --connect-timeout 20 -u "$SUNBIZ_SFTP_USER:$SUNBIZ_SFTP_PASS" "sftp://sftp.floridados.gov/~/doc/quarterly/$d/") || { rc=$?; break; }
            listing="$listing$body"$'\n'
          done
          if [ "$rc" -ne 0 ]; then
            echo "key=sunbiz-unlisted-$(date -u +%F)" >> "$GITHUB_OUTPUT"
          else
            hash=$(printf '%s' "$listing" | grep -E 'ficdata\.zip|cordata\.zip' | sha256sum | cut -c1-16)
            echo "key=sunbiz-$hash" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore Sunbiz cache
        id: sunbiz
        uses: actions/cache/restore@v4
        with:
          path: ~/sunbiz
          key: ${{ steps.stamp.outputs.key }}

      - name: Download the Sunbiz quarterly extract when the cache misses
        id: download
        if: steps.sunbiz.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set -uo pipefail
          rm -f ~/sunbiz/*.part
          curl -fsS -R --max-time 1080 --connect-timeout 20 --retry 3 -u "$SUNBIZ_SFTP_USER:$SUNBIZ_SFTP_PASS" -o ~/sunbiz/ficdata.zip.part "sftp://sftp.floridados.gov/~/doc/quarterly/fic/ficdata.zip" && mv ~/sunbiz/ficdata.zip.part ~/sunbiz/ficdata.zip
          curl -fsS -R --max-time 1080 --connect-timeout 20 --retry 3 -u "$SUNBIZ_SFTP_USER:$SUNBIZ_SFTP_PASS" -o ~/sunbiz/cordata.zip.part "sftp://sftp.floridados.gov/~/doc/quarterly/cor/cordata.zip" && mv ~/sunbiz/cordata.zip.part ~/sunbiz/cordata.zip
          unzip -tq ~/sunbiz/ficdata.zip && unzip -tq ~/sunbiz/cordata.zip

      - name: Save Sunbiz cache
        uses: actions/cache/save@v4
        if: steps.sunbiz.outputs.cache-hit != 'true' && steps.download.outcome == 'success'
        with:
          path: ~/sunbiz
          key: ${{ steps.stamp.outputs.key }}

      # The quarterly zip is up to 3 months old. The state also posts each business day's filings in the
      # same layout (doc/cor/CCYYMMDDc.txt, doc/fic/CCYYMMDDf.txt), so the files dated after each zip are
      # fetched and the owner scripts layer them on top (--daily-dir), and an owner who filed this week
      # is found this week. Measured 2026-11-06: about 3.6 MB (cor) and 0.9 MB (fic) a business day.
      - name: Download the state's daily filings dated after each quarterly zip
        id: daily
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set -uo pipefail
          mkdir -p ~/sunbiz-daily
          for spec in cor:c:cordata fic:f:ficdata; do
            IFS=: read -r dir suffix zip <<< "$spec"
            [ -f ~/sunbiz/$zip.zip ] || { echo "sunbiz-daily $dir no quarterly zip"; exit 1; }
            after="$(date -u -r ~/sunbiz/$zip.zip +%Y%m%d)"
            names=$(curl -fsS --list-only --max-time 60 --connect-timeout 20 -u "$SUNBIZ_SFTP_USER:$SUNBIZ_SFTP_PASS" "sftp://sftp.floridados.gov/~/doc/$dir/") || exit $?
            n=0
            for f in $(printf '%s\n' "$names" | grep -E "^[0-9]{8}${suffix}\.txt$" | sort); do
              [[ "${f:0:8}" > "$after" ]] || continue
              curl -fsS -R --max-time 300 --connect-timeout 20 --retry 3 -u "$SUNBIZ_SFTP_USER:$SUNBIZ_SFTP_PASS" -o ~/sunbiz-daily/$f.part "sftp://sftp.floridados.gov/~/doc/$dir/$f" && mv ~/sunbiz-daily/$f.part ~/sunbiz-daily/$f || exit $?
              n=$((n+1))
            done
            echo "sunbiz-daily $dir after=$after files=$n"
          done

      - name: Name the owner from the Florida fictitious-name register, 500 a run
        continue-on-error: true
        working-directory: core
        run: |
          set -uo pipefail
          rc=0
          fic_date="$(date -u -r ~/sunbiz/ficdata.zip +%F)"
          daily=""
          [ "${{ steps.daily.outcome }}" = "success" ] && daily="--daily-dir $HOME/sunbiz-daily"
          python3 scripts/vault-get.py CLOUDFLARE_CODEMODE_MCP_TOKEN --into CLOUDFLARE_API_TOKEN -- \
            bash -c "exec timeout 900 python3 scripts/oj-owner-from-sunbiz-fic.py --fic-zip ~/sunbiz/ficdata.zip --extract-date $fic_date $daily --limit 500 --apply > \"$RUNNER_TEMP/sunbiz-fic.log\" 2>&1" || rc=$?
          echo "sunbiz-fic exit=$rc"
          python3 - "$RUNNER_TEMP/sunbiz-fic.log" <<'PY'
          import json, sys
          line = ""
          for raw in open(sys.argv[1]):
              if raw.startswith("{"):
                  line = raw
          try:
              d = json.loads(line)
          except Exception:
              print(json.dumps({"unparsed": 1}))
              sys.exit(0)
          out = {}
          for k, v in d.items():
              if isinstance(v, bool):
                  continue
              if isinstance(v, (int, float)):
                  out[k] = v
              elif k == "by_confidence" and isinstance(v, dict) and all(isinstance(sv, int) and not isinstance(sv, bool) for sv in v.values()):
                  for sk, sv in v.items():
                      out[f"{k}_{sk}"] = sv
          print(json.dumps(out))
          PY
          if [ "$rc" -ne 0 ]; then
            tail -n 3 "$RUNNER_TEMP/sunbiz-fic.log" | { grep -E "$SAFE_LINES" || true; } | sed -E 's/[[:alnum:]._+-]+@[[:alnum:].-]+/[address]/g'
            exit "$rc"
          fi
          exit "$rc"

      - name: Name the owner from the Florida corporations register, 500 a run
        continue-on-error: true
        working-directory: core
        run: |
          set -uo pipefail
          rc=0
          cor_date="$(date -u -r ~/sunbiz/cordata.zip +%F)"
          daily=""
          [ "${{ steps.daily.outcome }}" = "success" ] && daily="--daily-dir $HOME/sunbiz-daily"
          python3 scripts/vault-get.py CLOUDFLARE_CODEMODE_MCP_TOKEN --into CLOUDFLARE_API_TOKEN -- \
            bash -c "exec timeout 1500 python3 scripts/oj-owner-from-sunbiz-cor.py --cor-zip ~/sunbiz/cordata.zip --extract-date $cor_date $daily --limit 500 --apply > \"$RUNNER_TEMP/sunbiz-cor.log\" 2>&1" || rc=$?
          echo "sunbiz-cor exit=$rc"
          python3 - "$RUNNER_TEMP/sunbiz-cor.log" <<'PY'
          import json, sys
          line = ""
          for raw in open(sys.argv[1]):
              if raw.startswith("{"):
                  line = raw
          try:
              d = json.loads(line)
          except Exception:
              print(json.dumps({"unparsed": 1}))
              sys.exit(0)
          out = {}
          for k, v in d.items():
              if isinstance(v, bool):
                  continue
              if isinstance(v, (int, float)):
                  out[k] = v
              elif k == "by_confidence" and isinstance(v, dict) and all(isinstance(sv, int) and not isinstance(sv, bool) for sv in v.values()):
                  for sk, sv in v.items():
                      out[f"{k}_{sk}"] = sv
          print(json.dumps(out))
          PY
          if [ "$rc" -ne 0 ]; then
            tail -n 3 "$RUNNER_TEMP/sunbiz-cor.log" | { grep -E "$SAFE_LINES" || true; } | sed -E 's/[[:alnum:]._+-]+@[[:alnum:].-]+/[address]/g'
            exit "$rc"
          fi
          exit "$rc"
