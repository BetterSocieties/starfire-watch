# Runs the free judge benchmark weekly and writes the refreshed STATE/free-judge-benchmark.json back
# to starfire-core, so scripts/token-efficiency-tests.py test T7 (limit 14 days) never reads a stale
# benchmark. The benchmark went 61 days without a refresh and failed T7.
# An INSUFFICIENT reading (too few cases scored, for example when no model answered) fails the job and is not pushed.
#
# Twin for BetterSocieties/starfire-watch/.github/workflows/core-free-judge-benchmark-refresh.yml
# (the repo that gets scheduled runners). This repository's Actions logs are public; the script
# prints only counts, a verdict word and the name of the model that answered.
name: core-free-judge-benchmark-refresh
on:
  schedule:
    - cron: "23 20 * * 3"
  workflow_dispatch:
    inputs:
      core_ref:
        description: "starfire-core ref (branch, tag or SHA) the scripts are checked out from; scheduled runs use main"
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: free-judge-benchmark-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout starfire-core
        uses: actions/checkout@v4
        with:
          repository: BetterSocieties/starfire-core
          token: ${{ secrets.GH_PAT }}
          ref: ${{ inputs.core_ref || 'main' }}
          path: core
          fetch-depth: 0
      - name: This copy is byte-identical to its twin in starfire-core
        run: |
          # the same check starfire-core runs from its side (scripts/check-oj-resend-watch-twin.py); a twin that is not on the ref is a failure, because
          # a scheduler copy nobody compares against could drift unseen
          twin=core/ops/watch-twin/core-free-judge-benchmark-refresh.yml
          if [ ! -f "$twin" ]; then echo "::error::no $twin at starfire-core ref ${{ inputs.core_ref || 'main' }}: merge the starfire-core PR that carries the twin first"; exit 1; fi
          diff -u "$twin" .github/workflows/core-free-judge-benchmark-refresh.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh free judge benchmark
        env:
          STARFIRE_VAULT_URL: https://starfire-vault.dark-wildflower-46d6.workers.dev
          STARFIRE_VAULT_BEARER: ${{ secrets.VAULT_BEARER }}
        working-directory: core
        run: |
          set +e -uo pipefail
          if [ -z "${STARFIRE_VAULT_BEARER:-}" ]; then
            echo "STARFIRE_VAULT_BEARER secret is missing"
            exit 1
          fi
          python3 scripts/free-judge-benchmark.py 2>&1 | tee "$RUNNER_TEMP/bench.txt"
          rc=${PIPESTATUS[0]}
          echo "exit=$rc" >> "$RUNNER_TEMP/bench.txt"
          if git diff --quiet STATE/free-judge-benchmark.json; then
            echo "no change to STATE/free-judge-benchmark.json, no reading was taken"
            exit 1
          fi
          verdict=$(python3 -c "import json, sys; print(json.load(open('STATE/free-judge-benchmark.json')).get('verdict', 'unknown'))")
          echo "verdict=$verdict" >> "$RUNNER_TEMP/bench.txt"
          if [ "$verdict" != "PASS" ] && [ "$verdict" != "FAIL" ]; then
            echo "::error::benchmark verdict is $verdict, not a real reading (too few cases were scored); nothing is pushed"
            exit 1
          fi
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 1 ]; then
            exit 0
          fi
          echo "free-judge-benchmark.py exited $rc, not a completed benchmark"
          exit "$rc"
      - name: Push refreshed benchmark back to starfire-core
        if: success()
        working-directory: core
        run: |
          git config user.name "starfire-free-judge-benchmark-refresh"
          git config user.email "info@bettersocieties.world"
          git add STATE/free-judge-benchmark.json
          git commit -m "chore: free judge benchmark refresh from public runner ${{ github.run_id }}"
          bash scripts/push-to-main.sh
          echo "pushed=yes" >> "$RUNNER_TEMP/bench.txt"
      - name: Summary
        if: always()
        run: |
          {
            echo "| step | result |"
            echo "|---|---|"
            exit_code=$(grep '^exit=' "$RUNNER_TEMP/bench.txt" | cut -d= -f2 || true)
            verdict_val=$(grep '^verdict=' "$RUNNER_TEMP/bench.txt" | cut -d= -f2 || true)
            pushed_val=$(grep '^pushed=' "$RUNNER_TEMP/bench.txt" | cut -d= -f2 || true)
            echo "| free-judge-benchmark.py | ${exit_code:-not run} |"
            echo "| verdict | ${verdict_val:-unknown} |"
            echo "| pushed to starfire-core | ${pushed_val:-no} |"
          } >> "$GITHUB_STEP_SUMMARY"