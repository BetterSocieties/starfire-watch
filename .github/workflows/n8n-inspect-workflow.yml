name: n8n-inspect-workflow
on:
  workflow_dispatch:
    inputs:
      workflow_ids:
        description: "Comma-separated n8n pod workflow ids to inspect"
        required: true
        type: string
concurrency:
  group: n8n-inspect-workflow
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: offline publish regression
        run: bash scripts/test-n8n-inspect-publish.sh
  inspect:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: gate
        id: gate
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: |
          if [ -z "$N8N_API_KEY" ]; then echo "ready=no" >> "$GITHUB_OUTPUT"; else echo "ready=yes" >> "$GITHUB_OUTPUT"; fi
      - name: read pod url
        if: steps.gate.outputs.ready == 'yes'
        uses: actions/checkout@v4
        with:
          repository: BetterSocieties/starfire-core
          token: ${{ secrets.CORE_READ_TOKEN }}
          path: core
          sparse-checkout: config/n8n-cloud-url
      - name: inspect workflows
        if: steps.gate.outputs.ready == 'yes'
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          WORKFLOW_IDS: ${{ inputs.workflow_ids }}
        run: |
          export N8N_URL="$(cat core/config/n8n-cloud-url)"
          bash scripts/n8n-inspect-workflow.sh
      - name: publish inspect report
        if: always() && steps.gate.outputs.ready == 'yes'
        run: |
          test -f data/n8n-workflow-inspect.json || exit 0
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name starfire-watch
          git config user.email actions@users.noreply.github.com
          git add data/n8n-workflow-inspect.json
          git diff --cached --quiet || git commit -m "n8n-inspect-workflow report $(date -u +%FT%TZ)"
          # Rebase and retry when main moved; fail loudly if no push succeeded.
          pushed=0; last_err=""
          for attempt in 1 2 3; do
            if last_err=$(git push -q origin HEAD:main 2>&1); then pushed=1; break; fi
            [ "$attempt" -lt 3 ] || break
            if ! last_err=$(git pull --rebase -q origin main 2>&1); then
              git rebase --abort || true
              break
            fi
            sleep $((attempt * 2))
          done
          if [ "$pushed" -ne 1 ]; then
            echo "$last_err" >&2
            echo "inspect report publication failed" >&2
            exit 1
          fi
