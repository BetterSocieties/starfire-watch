# Daily Retell balance probe for OpsJuice Annie. Retell dropped every call as no_valid_payment from
# 2026-08-07 and nothing said so for 67 days. This probes Retell directly (create-web-call: 402 when
# credit is exhausted) and posts to Slack itself, so it does not depend on the n8n pod it watches.
# Public repository, so runners are free. Slack token: the working open_brain bot, because
# STARFIRE_DB_CONFIG_SLACK_BOT_TOKEN answers invalid_auth (checked 2026-10-12).
# ON PUSH to this file it runs the same probe once, so a branch push proves the alert fires.
name: core-oj-retell-balance-daily
on:
  schedule:
    - cron: "15 13 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - .github/workflows/core-oj-retell-balance-daily.yml
      - scripts/check-retell-balance.py
      - scripts/check-vapi-spend.py

permissions:
  contents: read

concurrency:
  group: core-oj-retell-balance-daily
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Checkout starfire-core (vault-get.py lives there)
        uses: actions/checkout@v4
        with:
          repository: BetterSocieties/starfire-core
          token: ${{ secrets.GH_PAT }}
          ref: main
          path: core
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe Retell and alert Slack on refusal
        env:
          STARFIRE_VAULT_URL: https://starfire-vault.dark-wildflower-46d6.workers.dev
          STARFIRE_VAULT_BEARER: ${{ secrets.VAULT_BEARER }}
        run: |
          set -eo pipefail
          python3 core/scripts/vault-get.py RETELL_API_KEY_API_KEY --into RETELL_API_KEY -- \
            python3 core/scripts/vault-get.py OPEN_BRAIN_SUPABASE_SLACK_BOT_TOKEN --into SLACK_BOT_TOKEN -- \
            python3 scripts/check-retell-balance.py
      - name: Probe Vapi spend (demo line) and alert Slack near the end of the free credit
        if: always()
        env:
          STARFIRE_VAULT_URL: https://starfire-vault.dark-wildflower-46d6.workers.dev
          STARFIRE_VAULT_BEARER: ${{ secrets.VAULT_BEARER }}
        run: |
          set -eo pipefail
          python3 core/scripts/vault-get.py VAPI_API_KEY --into VAPI_API_KEY -- \
            python3 core/scripts/vault-get.py OPEN_BRAIN_SUPABASE_SLACK_BOT_TOKEN --into SLACK_BOT_TOKEN -- \
            python3 scripts/check-vapi-spend.py
