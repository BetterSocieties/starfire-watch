# Cloud-tick heartbeat freshness alarm. SCHEDULE DISABLED 2026-08-13, manual only.
#
# It watches agent/cloud-tick-heartbeat.log in starfire-core and Slacks Adrien
# when the newest line is more than 150 minutes old. That was the right idea
# attached to the wrong thing. The line it was reading was written every 300
# seconds by com.starfire.agent-host-free and by com.starfire.model-failover-
# watchdog, both of which only ever asked a free model to classify three
# invented businesses, or asked a local model to echo one fixed string back.
# A heartbeat that stays fresh because a job is faithfully doing nothing is not
# a liveness signal, it is a green light wired to itself.
#
# Both of those jobs were removed on 2026-08-13, so nothing writes that file any
# more and this alarm would fire every two hours to report the absence of work
# that was deliberately stopped. Twelve true but useless messages a day is the
# same failure as the digest it shares a webhook with.
#
# It comes back on the day scripts/hourly-brief.py starts running, pointed at
# that brief's own timestamp, because then a missing heartbeat means the hourly
# revenue routine stopped, which is worth waking someone for.
name: heartbeat-alarm
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: fetch heartbeat log from starfire-core
        env:
          CORE_READ_TOKEN: ${{ secrets.CORE_READ_TOKEN }}
        run: |
          curl -sf -H "Authorization: Bearer $CORE_READ_TOKEN" \
            "https://api.github.com/repos/BetterSocieties/starfire-core/contents/agent/cloud-tick-heartbeat.log" \
            -H "Accept: application/vnd.github.raw" -o hb.log
          tail -3 hb.log
      - name: alarm if stale
        run: |
          last=$(tail -1 hb.log | cut -d' ' -f1)
          last_epoch=$(date -d "$last" +%s 2>/dev/null || echo 0)
          age=$(( $(date +%s) - last_epoch ))
          echo "last heartbeat: $last (age ${age}s)"
          if [ "$age" -gt 9000 ]; then
            curl -s -X POST "https://n8n.opsjuice.com/webhook/starfire-shipped-digest" \
              -H "Content-Type: application/json" \
              -d "{\"text\":\"ALARM: starfire-cloud-tick heartbeat stale (last $last, age ${age}s > 150min). The hourly cloud routine has stopped pushing. Check https://claude.ai/code/routines\"}"
            echo "ALARM SENT"
          else
            echo "fresh, no alarm"
          fi
