name: lint-checkout-ref
# A cross-repo checkout with no ref spends a REST call on the shared token to find the default branch.
# On 2026-11-04 that killed every OJ sourcing job when the token ran out.
on:
  pull_request:
    paths: [".github/workflows/**"]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Every cross-repo checkout names its ref
        run: |
          python3 - <<'PY'
          import glob, re, sys
          step = re.compile(r"^\s*- (name|uses|run|id|if|with|env|shell|continue-on-error|timeout-minutes|working-directory):", re.M)
          bad = []
          for f in glob.glob(".github/workflows/*.yml"):
              text = open(f).read()
              at = [m.start() for m in step.finditer(text)] + [len(text)]
              for x, y in zip(at, at[1:]):
                  c = text[x:y]
                  if "actions/checkout@" in c and re.search(r"^\s+repository:", c, re.M) and not re.search(r"^\s+ref:", c, re.M):
                      bad.append(f)
          print("\n".join(bad) or "ok")
          sys.exit(1 if bad else 0)
          PY
