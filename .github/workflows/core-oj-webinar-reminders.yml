# Send the 24 hour and 1 hour OpsJuice webinar reminders. Decision: GitHub issue #4955 item 2.
#
# Hourly, at :35 (GitHub says the top of the hour is the busiest time for schedule events, and
# :35 is clear of every other cron in this repository). scripts/oj-webinar-reminders.py reads
# config/oj-webinar.json in starfire-core. While next_session_utc is null it prints one line
# and exits 0, and this job does nothing else. Otherwise it posts each reminder to the Worker's
# send door once per registrant, deduped on an oj_events row of kind reminder_sent.
#
# The Worker address and send token are fetched from the vault only when a session is set, so
# the job is green and inert before the Worker exists.
name: core-oj-webinar-reminders
on:
  schedule:
    - cron: "35 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: core-oj-webinar-reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout starfire-core (the repository the scripts live in)
        uses: actions/checkout@v4
        with:
          repository: BetterSocieties/starfire-core
          token: ${{ secrets.GH_PAT }}
          path: core
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send the reminders that are due
        working-directory: core
        env:
          STARFIRE_VAULT_URL: https://starfire-vault.dark-wildflower-46d6.workers.dev
          STARFIRE_VAULT_BEARER: ${{ secrets.VAULT_BEARER }}
        run: |
          set -uo pipefail
          if python3 -c "import json,sys; sys.exit(0 if json.load(open('config/oj-webinar.json'))['next_session_utc'] is None else 1)"; then
            python3 scripts/oj-webinar-reminders.py
            exit $?
          fi
          scripts/with-vault-env.sh OJ_SUPABASE_URL OJ_SUPABASE_SERVICE_ROLE OJ_WORKER_URL OJ_WORKER_SEND_TOKEN -- \
            python3 scripts/oj-webinar-reminders.py

      - name: Tell Slack the job failed
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg t "core-oj-webinar-reminders failed. Run: $RUN_URL" '{channel: "#starfire-done", text: $t}' \
            | curl -sS --fail-with-body -X POST -H "Content-Type: application/json" -d @- \
              https://n8n.opsjuice.com/webhook/starfire-alert-relay
