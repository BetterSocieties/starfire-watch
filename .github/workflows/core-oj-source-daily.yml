# Copy of BetterSocieties/starfire-watch .github/workflows/core-oj-source-daily.yml as shipped by the watch PR for #5223.
# The OpsJuice W1 to W3 chain, one run every weekday: source new prospects, read the website of the
# unmeasured ones best-ranked first (home services, then law, then med spas), find public contact
# addresses for home services, stamp the fit verdict, screen against the owner-operator ICP, then
# verify addresses. Every step writes its outcome onto the prospect row.
# Decisions: GitHub issue map BetterSocieties/starfire-core#4953 (#4957 for what is sendable).
#
# 05:00 UTC Monday to Friday, so the whole chain has finished before the sender (14:30). Overture Maps
# Places for today's 3 metros from config/oj-metros.json (scripts/oj-source-overture.py --rotate), then
# scripts/oj-enrich-home-services-booking-signal.py reads up to 6000 unmeasured sites (0.8 s a row
# observed on 2026-10-13, so about 80 minutes) for widgets and service-area phrases, scripts/oj-discover-emails-from-website.py
# reads home-services sites for an address, scripts/oj-stamp-icp-verdict.py writes the fit verdict, and the
# owner-operator screen scores every queued row, with or without an address (the LinkedIn path needs none).
# The second job is core-oj-verify-daily.yml called as a reusable workflow: address kind, MX, mailbox.
#
# WHY THE SITE READ HAS NO ADDRESS FILTER. Until 2026-10-13 it ran with --email-only and the screen
# read only rows with an address. Almost no unscreened row had one, so 1,400 of 1,500 rows came back
# cannot_read: nothing had measured their website. The measure was never missing, it was never aimed.
#
# WHY HERE AND NOT IN starfire-core. This repository is PUBLIC so its runners are free;
# starfire-core is private and its scheduled jobs are refused a runner. core- is the prefix for
# a job here whose code lives there (see core-oj-observation-refresh.yml).
#
# THE LOG IS WORLD READABLE. Both scripts print business names and discovered addresses as
# they go, so their output goes to a file on the runner and only the count lines are echoed.
# The exit codes are kept: any non-zero exit fails the run and posts to Slack.
#
# The vault secret is named secrets.VAULT_BEARER in this repository. Secrets are read at
# runtime through scripts/vault-get.py; none is stored for these jobs.
name: core-oj-source-daily
on:
  # MERGE ONLY AFTER migrations 20261017115900, 20261017120000, 20261017130100 and 20261017130200 are applied to the
  # OpsJuice database: the import refuses (exit 3) while prospects_outreach_state_check does not admit 'unscreened',
  # and every read below has a 10 s statement timeout that only the 130200 partial indexes keep it under.
  # A scheduled run applies. A manual run is a dry run unless apply=true: every step reads and prints, and not one of
  # the six writes a row.
  schedule:
    - cron: "0 5 * * 1-5"
  workflow_dispatch:
    inputs:
      apply:
        description: "true inserts and writes; anything else is a dry run"
        default: "false"


permissions:
  contents: read

concurrency:
  group: core-oj-source-daily
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout starfire-core (the repository the scripts live in)
        uses: actions/checkout@v4
        with:
          repository: BetterSocieties/starfire-core
          token: ${{ secrets.GH_PAT }}
          path: core
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install duckdb (reads the Overture parquet over S3)
        run: pip install --quiet duckdb==1.1.3

      - name: Source today's metros from Overture
        working-directory: core
        env:
          STARFIRE_VAULT_URL: https://starfire-vault.dark-wildflower-46d6.workers.dev
          STARFIRE_VAULT_BEARER: ${{ secrets.VAULT_BEARER }}
        run: |
          set -uo pipefail
          rc=0
          # import: --pool-over-sql reads the held pool on ONE connection in physical-order ctid ranges of 256 pages, each
          # statement under a 10 s timeout (REST offset paging 500s past ~150k rows; a keyset on the uuid key is random IO);
          # --apply also makes the importer read the live constraint and refuse unless it admits 'unscreened'.
          flag=""; [ "${{ github.event_name == 'schedule' || inputs.apply == 'true' }}" = "true" ] && flag="--apply"
          scripts/with-vault-env.sh OJ_SUPABASE_SECRET_KEY OJ_SUPABASE_DB_PASSWORD -- sh -c '
            PGPASSWORD="$OJ_SUPABASE_DB_PASSWORD" python3 scripts/oj-source-overture.py --rotate --pool-over-sql '"$flag"'' \
            > "$RUNNER_TEMP/overture.log" 2>&1 || { rc=$?; echo "overture exit=$rc"; tail -n 3 "$RUNNER_TEMP/overture.log" | sed -E 's/[[:alnum:]._+-]+@[[:alnum:].-]+/[address]/g'; }
          grep -E '^(Metros today|Metro:|Found|After filtering|Existing hosts|After dedupe|Inserted|Nothing to insert)' "$RUNNER_TEMP/overture.log" || true
          exit $rc

      - name: Discover public addresses from the websites of home-services rows
        working-directory: core
        env:
          STARFIRE_VAULT_URL: https://starfire-vault.dark-wildflower-46d6.workers.dev
          STARFIRE_VAULT_BEARER: ${{ secrets.VAULT_BEARER }}
        run: |
          set -uo pipefail
          rc=0
          niches="$(python3 -c "import sys; sys.path.insert(0, 'scripts'); import oj_icp_canon as c; print(','.join(next(e for e in c.cold_screen_entries() if e['slug'] == 'home-services')['sourcing']['store_niches']))")"
          flag=""; [ "${{ github.event_name == 'schedule' || inputs.apply == 'true' }}" = "true" ] && flag="--apply"
          # the worklist is read over SQL on one connection, 10 s timeout, through prospects_email_worklist_open_idx
          # (the REST form answered HTTP 500, statement timeout, on 2026-10-17)
          scripts/with-vault-env.sh OJ_SUPABASE_DB_PASSWORD -- sh -c '
            PGPASSWORD="$OJ_SUPABASE_DB_PASSWORD" python3 scripts/oj-discover-emails-from-website.py --niche "'"$niches"'" --limit 120 '"$flag" \
            > "$RUNNER_TEMP/discover.log" 2>&1 || rc=$?
          echo "discover exit=$rc"
          [ "$rc" -eq 0 ] || tail -n 3 "$RUNNER_TEMP/discover.log" | sed -E 's/[[:alnum:]._+-]+@[[:alnum:].-]+/[address]/g'
          grep -E '^(suppression:|worklist:|found=)' "$RUNNER_TEMP/discover.log" || true
          exit $rc

      - name: Read each new row's own website (booking widget, service area phrases)
        working-directory: core
        env:
          STARFIRE_VAULT_URL: https://starfire-vault.dark-wildflower-46d6.workers.dev
          STARFIRE_VAULT_BEARER: ${{ secrets.VAULT_BEARER }}
        run: |
          set -uo pipefail
          rc=0
          flag=""; [ "${{ github.event_name == 'schedule' || inputs.apply == 'true' }}" = "true" ] && flag="--apply"
          # the rows owed a read come over SQL with PGPASSWORD (the REST keyset read answered HTTP 500 on 10-15 and 10-16)
          scripts/with-vault-env.sh OJ_SUPABASE_SECRET_KEY OJ_SUPABASE_DB_PASSWORD -- sh -c '
            OJ_KEY="$OJ_SUPABASE_SECRET_KEY" PGPASSWORD="$OJ_SUPABASE_DB_PASSWORD" python3 scripts/oj-enrich-home-services-booking-signal.py \
              '"$flag"' --limit 6000' > "$RUNNER_TEMP/signals.log" 2>&1 || rc=$?
          echo "site signals exit=$rc"
          [ "$rc" -eq 0 ] || tail -n 3 "$RUNNER_TEMP/signals.log" | sed -E 's/[[:alnum:]._+-]+@[[:alnum:].-]+/[address]/g'
          sed -n '/^--- run summary ---/,$p' "$RUNNER_TEMP/signals.log" || true
          grep -E '^(queued home-services rows|measured, or tried|rows to check)' "$RUNNER_TEMP/signals.log" || true
          exit $rc

      - name: Quote each new row's published phone and hours (criterion 4 needs the quote)
        working-directory: core
        env:
          STARFIRE_VAULT_URL: https://starfire-vault.dark-wildflower-46d6.workers.dev
          STARFIRE_VAULT_BEARER: ${{ secrets.VAULT_BEARER }}
        run: |
          set -uo pipefail
          rc=0
          # The screen answers ring_out only from a stored quote. Without this step a freshly sourced row can never
          # match, so it would sit unscreened for ever.
          flag=""; [ "${{ github.event_name == 'schedule' || inputs.apply == 'true' }}" = "true" ] && flag="--apply"
          scripts/with-vault-env.sh OJ_SUPABASE_DB_PASSWORD -- sh -c '
            PGPASSWORD="$OJ_SUPABASE_DB_PASSWORD" python3 scripts/oj-quote-the-published-phone-and-hours.py \
              --scope unscreened --limit 3000 '"$flag"'' > "$RUNNER_TEMP/quote.log" 2>&1 || rc=$?
          echo "quote exit=$rc"
          [ "$rc" -eq 0 ] || tail -n 3 "$RUNNER_TEMP/quote.log" | sed -E 's/[[:alnum:]._+-]+@[[:alnum:].-]+/[address]/g'
          grep -E '^rows ' "$RUNNER_TEMP/quote.log" || true
          exit $rc

      - name: Stamp the fit verdict the sender's pool reads
        working-directory: core
        env:
          STARFIRE_VAULT_URL: https://starfire-vault.dark-wildflower-46d6.workers.dev
          STARFIRE_VAULT_BEARER: ${{ secrets.VAULT_BEARER }}
        run: |
          set -uo pipefail
          rc=0
          # One process, one connection: the stamper reads 500 rows a statement (after the last id it saw, through
          # prospects_icp_stamp_owed_idx) and repeats until none are left. A dry run reads one batch and writes nothing.
          flag=""; [ "${{ github.event_name == 'schedule' || inputs.apply == 'true' }}" = "true" ] && flag="--apply"
          # rows come over SQL (PGPASSWORD); a gateway 5xx on one write is retried and, if it persists, deferred a day
          scripts/with-vault-env.sh OJ_SUPABASE_DB_PASSWORD -- sh -c 'PGPASSWORD="$OJ_SUPABASE_DB_PASSWORD" python3 scripts/oj-stamp-icp-verdict.py --from-store '"$flag" > "$RUNNER_TEMP/stamp.log" 2>&1 || rc=$?
          grep -E '^(wrote|nothing to stamp|database connections)' "$RUNNER_TEMP/stamp.log" | cut -c1-60 || true
          echo "stamp exit=$rc"
          [ "$rc" -eq 0 ] || tail -n 6 "$RUNNER_TEMP/stamp.log" | sed -E 's/[[:alnum:]._+-]+@[[:alnum:].-]+/[address]/g'
          exit $rc

      - name: Screen every unscreened row against the owner-operator ICP
        working-directory: core
        env:
          STARFIRE_VAULT_URL: https://starfire-vault.dark-wildflower-46d6.workers.dev
          STARFIRE_VAULT_BEARER: ${{ secrets.VAULT_BEARER }}
        run: |
          set -uo pipefail
          rc=0
          # screen: --write also runs oj_promote_screened.py (psql, needs PGPASSWORD): a passing US row goes to queued
          flag=""; [ "${{ github.event_name == 'schedule' || inputs.apply == 'true' }}" = "true" ] && flag="--write"
          scripts/with-vault-env.sh OJ_SUPABASE_SECRET_KEY OJ_SUPABASE_DB_PASSWORD -- sh -c '
            OJ_KEY="$OJ_SUPABASE_SECRET_KEY" PGPASSWORD="$OJ_SUPABASE_DB_PASSWORD" python3 scripts/oj-screen-the-pool-against-the-owner-operator-icp.py \
              --unscreened '"$flag"' --summary-md "$RUNNER_TEMP/screened.md"' > "$RUNNER_TEMP/screen.log" 2>&1 || rc=$?
          echo "screen exit=$rc"
          cat "$RUNNER_TEMP/screen.log"
          {
            echo "### Screened today"
            echo ""
            if [ -f "$RUNNER_TEMP/screened.md" ]; then cat "$RUNNER_TEMP/screened.md"; else echo "No list was written."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  verify:
    needs: source
    uses: ./.github/workflows/core-oj-verify-daily.yml
    secrets: inherit
