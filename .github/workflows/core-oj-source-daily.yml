# Source new OpsJuice prospects every weekday, find each one's public contact address, read its own
# site, stamp the fit verdict and screen it, all in one run so a new row is never left unscreened.
# Decisions: GitHub issue map BetterSocieties/starfire-core#4953 (#4957 for what is sendable).
#
# 13:00 UTC Monday to Friday. Overture Maps Places for today's 3 metros from config/oj-metros.json
# (scripts/oj-source-overture.py --rotate), then scripts/oj-discover-emails-from-website.py reads
# each queued business's own website for an address, scripts/oj-enrich-home-services-booking-signal.py
# reads the same sites for widgets and service-area phrases, scripts/oj-stamp-icp-verdict.py writes
# the fit verdict, and the owner-operator screen scores the row. Address verification (kind, MX,
# mailbox) is its own job, core-oj-verify-daily.yml, the next morning before the sender runs.
#
# WHY HERE AND NOT IN starfire-core. This repository is PUBLIC so its runners are free;
# starfire-core is private and its scheduled jobs are refused a runner. core- is the prefix for
# a job here whose code lives there (see core-oj-observation-refresh.yml).
#
# THE LOG IS WORLD READABLE. Both scripts print business names and discovered addresses as
# they go, so their output goes to a file on the runner and only the count lines are echoed.
# The exit codes are kept: any non-zero exit fails the run and posts to Slack.
#
# The vault secret is named secrets.VAULT_BEARER in this repository. Secrets are read at
# runtime through scripts/vault-get.py; none is stored for these jobs.
name: core-oj-source-daily
on:
  schedule:
    - cron: "0 13 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: core-oj-source-daily
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout starfire-core (the repository the scripts live in)
        uses: actions/checkout@v4
        with:
          repository: BetterSocieties/starfire-core
          token: ${{ secrets.GH_PAT }}
          path: core
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install duckdb (reads the Overture parquet over S3)
        run: pip install --quiet duckdb==1.1.3

      - name: Source today's metros from Overture
        working-directory: core
        env:
          STARFIRE_VAULT_URL: https://starfire-vault.dark-wildflower-46d6.workers.dev
          STARFIRE_VAULT_BEARER: ${{ secrets.VAULT_BEARER }}
        run: |
          set -uo pipefail
          rc=0
          scripts/with-vault-env.sh OJ_SUPABASE_SECRET_KEY -- \
            python3 scripts/oj-source-overture.py --rotate --apply \
            > "$RUNNER_TEMP/overture.log" 2>&1 || { rc=$?; echo "overture exit=$rc"; tail -n 3 "$RUNNER_TEMP/overture.log" | sed -E 's/[[:alnum:]._+-]+@[[:alnum:].-]+/[address]/g'; }
          grep -E '^(Metros today|Metro:|Found|After filtering|Existing hosts|After dedupe|Inserted|Nothing to insert)' "$RUNNER_TEMP/overture.log" || true
          exit $rc

      - name: Discover public addresses from each business's own website
        working-directory: core
        env:
          STARFIRE_VAULT_URL: https://starfire-vault.dark-wildflower-46d6.workers.dev
          STARFIRE_VAULT_BEARER: ${{ secrets.VAULT_BEARER }}
        run: |
          set -uo pipefail
          rc=0
          python3 scripts/oj-discover-emails-from-website.py --limit 250 --apply \
            > "$RUNNER_TEMP/discover.log" 2>&1 || rc=$?
          echo "discover exit=$rc"
          [ "$rc" -eq 0 ] || tail -n 3 "$RUNNER_TEMP/discover.log" | sed -E 's/[[:alnum:]._+-]+@[[:alnum:].-]+/[address]/g'
          grep -E '^(suppression:|worklist:|found=)' "$RUNNER_TEMP/discover.log" || true
          exit $rc

      - name: Read each new row's own website (booking widget, service area phrases)
        working-directory: core
        env:
          STARFIRE_VAULT_URL: https://starfire-vault.dark-wildflower-46d6.workers.dev
          STARFIRE_VAULT_BEARER: ${{ secrets.VAULT_BEARER }}
        run: |
          set -uo pipefail
          rc=0
          scripts/with-vault-env.sh OJ_SUPABASE_SECRET_KEY -- sh -c '
            OJ_KEY="$OJ_SUPABASE_SECRET_KEY" python3 scripts/oj-enrich-home-services-booking-signal.py \
              --apply --email-only --limit 400' > "$RUNNER_TEMP/signals.log" 2>&1 || rc=$?
          echo "site signals exit=$rc"
          [ "$rc" -eq 0 ] || tail -n 3 "$RUNNER_TEMP/signals.log" | sed -E 's/[[:alnum:]._+-]+@[[:alnum:].-]+/[address]/g'
          sed -n '/^--- run summary ---/,$p' "$RUNNER_TEMP/signals.log" || true
          grep -E '^(queued home-services rows|already carrying|rows to check)' "$RUNNER_TEMP/signals.log" || true
          exit $rc

      - name: Stamp the fit verdict the sender's pool reads
        working-directory: core
        env:
          STARFIRE_VAULT_URL: https://starfire-vault.dark-wildflower-46d6.workers.dev
          STARFIRE_VAULT_BEARER: ${{ secrets.VAULT_BEARER }}
        run: |
          set -uo pipefail
          rc=0
          python3 scripts/oj-stamp-icp-verdict.py --from-store --apply > "$RUNNER_TEMP/stamp.log" 2>&1 || rc=$?
          echo "stamp exit=$rc"
          tail -n 6 "$RUNNER_TEMP/stamp.log" | sed -E 's/[[:alnum:]._+-]+@[[:alnum:].-]+/[address]/g'
          exit $rc

      - name: Screen every unscreened row against the owner-operator ICP
        working-directory: core
        env:
          STARFIRE_VAULT_URL: https://starfire-vault.dark-wildflower-46d6.workers.dev
          STARFIRE_VAULT_BEARER: ${{ secrets.VAULT_BEARER }}
        run: |
          set -uo pipefail
          rc=0
          scripts/with-vault-env.sh OJ_SUPABASE_SECRET_KEY -- sh -c '
            OJ_KEY="$OJ_SUPABASE_SECRET_KEY" python3 scripts/oj-screen-the-pool-against-the-owner-operator-icp.py \
              --unscreened --write --summary-md "$RUNNER_TEMP/screened.md"' > "$RUNNER_TEMP/screen.log" 2>&1 || rc=$?
          echo "screen exit=$rc"
          cat "$RUNNER_TEMP/screen.log"
          {
            echo "### Screened today"
            echo ""
            if [ -f "$RUNNER_TEMP/screened.md" ]; then cat "$RUNNER_TEMP/screened.md"; else echo "No list was written."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Tell Slack the job failed
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg t "core-oj-source-daily failed. Run: $RUN_URL" '{channel: "#starfire-done", text: $t}' \
            | curl -sS --fail-with-body -X POST -H "Content-Type: application/json" -d @- \
              https://n8n.opsjuice.com/webhook/starfire-alert-relay
