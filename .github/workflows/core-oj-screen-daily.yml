# Screen every unscreened OpsJuice prospect against the owner-operator ICP, every weekday.
# Decisions: #4953, #4957 (the ICP screen sits ahead of mailbox verification) and #4958
# (the send door refuses a prospect with no passing screen).
#
# 13:45 UTC Monday to Friday, after core-oj-source-daily has sourced and found addresses.
# Runs scripts/oj-screen-the-pool-against-the-owner-operator-icp.py --unscreened --write and
# puts the screened list (business, trade, rank, evidence) in the job summary, best rank
# first. The list names public businesses and nothing else: addresses are redacted from the
# evidence column before it is written, and the workflow log carries counts only.
name: core-oj-screen-daily
on:
  schedule:
    - cron: "45 13 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: core-oj-screen-daily
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout starfire-core (the repository the scripts live in)
        uses: actions/checkout@v4
        with:
          repository: BetterSocieties/starfire-core
          token: ${{ secrets.GH_PAT }}
          path: core
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Screen the unscreened rows
        working-directory: core
        env:
          STARFIRE_VAULT_URL: https://starfire-vault.dark-wildflower-46d6.workers.dev
          STARFIRE_VAULT_BEARER: ${{ secrets.VAULT_BEARER }}
        run: |
          set -uo pipefail
          rc=0
          scripts/with-vault-env.sh OJ_SUPABASE_SECRET_KEY -- sh -c '
            OJ_KEY="$OJ_SUPABASE_SECRET_KEY" python3 scripts/oj-screen-the-pool-against-the-owner-operator-icp.py \
              --unscreened --write --summary-md "$RUNNER_TEMP/screened.md"' || rc=$?
          echo "screen exit=$rc"
          {
            echo "### Screened today"
            echo ""
            if [ -f "$RUNNER_TEMP/screened.md" ]; then cat "$RUNNER_TEMP/screened.md"; else echo "No list was written."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Tell Slack the job failed
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg t "core-oj-screen-daily failed. Run: $RUN_URL" '{channel: "#starfire-done", text: $t}' \
            | curl -sS --fail-with-body -X POST -H "Content-Type: application/json" -d @- \
              https://n8n.opsjuice.com/webhook/starfire-alert-relay
