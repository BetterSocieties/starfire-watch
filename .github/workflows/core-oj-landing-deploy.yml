# Cloud twin of starfire-core's oj-landing-deploy (Cloudflare Pages project opsjuice-ai-assessment, opsjuice.com).
# Why it lives here: since 2026-10-17 ~19:30Z the PRIVATE repo starfire-core cannot start any Actions job ("recent account
# payments have failed or your spending limit needs to be increased"): its 2,000 free private-repo minutes for the
# month were spent. Public repos run free, so the deploy runs from this public repo and checks core out with GH_PAT,
# the same way every core-*.yml twin here does. Log safety: the steps print page names and HTTP codes only (no
# `set -x`, no env dump); GH_PAT and CLOUDFLARE_PAGES_TOKEN are masked by Actions.
# Triggers: workflow_dispatch (core_ref selectable) and an off-peak poll that deploys only when core main changed a
# landing input since the last green run of THIS workflow, standing in for core's push trigger.
name: core-oj-landing-deploy
on:
  schedule:
    - cron: "11 */2 * * *"
  workflow_dispatch:
    inputs:
      core_ref:
        description: "starfire-core ref (branch, tag or SHA) to build and publish; scheduled runs use main"
        type: string
        default: main

permissions:
  contents: read
  actions: read

concurrency:
  group: core-oj-landing-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout starfire-core
        uses: actions/checkout@v4
        with:
          repository: BetterSocieties/starfire-core
          token: ${{ secrets.GH_PAT }}
          ref: ${{ inputs.core_ref || 'main' }}
          path: core
          fetch-depth: 0

      - name: Gate (a scheduled run publishes only when a landing input changed since the last green run)
        id: gate
        working-directory: core
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          skip=false
          if [ "$EVENT" = "schedule" ]; then
            last=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/core-oj-landing-deploy.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].run_started_at // ""')
            if [ -n "$last" ]; then
              n=$(git log --since="$last" --oneline -- \
                scripts/build-oj-webinar-page.py scripts/build-oj-welcome-pages.py ops/oj-post-payment-pages.json \
                scripts/oj-apply-site-chrome.py scripts/oj-place-affiliate-disclosure.py ventures/opsjuice/generators/affiliate \
                config/oj-webinar.json ventures/opsjuice/oj-icp-canonical.json ventures/opsjuice/webinar-pages \
                ventures/opsjuice/landing scripts/deploy-oj-landing.sh scripts/deploy-cf-pages.sh | wc -l)
              echo "landing-input commits on core since $last: $n"
              [ "$n" = "0" ] && skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install dev dependencies and run the landing tests
        if: steps.gate.outputs.skip != 'true'
        working-directory: core
        run: |
          npm ci --include=dev --ignore-scripts
          node --test scripts/tests/test-nps-open.mjs scripts/tests/test-landing-pages.mjs scripts/tests/test-oj-nps-fires-referral-ask.mjs

      - name: Generate the webinar pages
        if: steps.gate.outputs.skip != 'true'
        working-directory: core
        run: |
          python3 scripts/build-oj-webinar-page.py --self-test
          python3 scripts/build-oj-webinar-page.py

      - name: Generate the post-payment welcome pages
        if: steps.gate.outputs.skip != 'true'
        working-directory: core
        run: |
          python3 scripts/build-oj-welcome-pages.py --self-test
          python3 scripts/build-oj-welcome-pages.py

      - name: Place the affiliate disclosure page and stylesheet
        if: steps.gate.outputs.skip != 'true'
        working-directory: core
        run: |
          python3 scripts/oj-place-affiliate-disclosure.py --self-test
          python3 scripts/oj-place-affiliate-disclosure.py

      - name: Apply the shared site header and footer
        if: steps.gate.outputs.skip != 'true'
        working-directory: core
        run: |
          python3 scripts/oj-apply-site-chrome.py --self-test
          python3 scripts/oj-apply-site-chrome.py

      - name: Refuse to publish a tree that is missing a page the live site lists
        if: steps.gate.outputs.skip != 'true'
        working-directory: core
        run: |
          python3 - <<'PY'
          import os, re, sys, urllib.request
          req = urllib.request.Request("https://opsjuice.com/sitemap.xml", headers={"User-Agent": "Mozilla/5.0 (oj-landing-deploy)"})
          live = urllib.request.urlopen(req, timeout=30).read().decode()
          missing = []
          for loc in re.findall(r"<loc>https://opsjuice.com(/[^<]*)</loc>", live):
              path = loc.strip("/") or "index"
              base = "ventures/opsjuice/landing/" + path
              if not (os.path.exists(base + ".html") or os.path.exists(base + "/index.html") or os.path.exists(base)):
                  missing.append(loc)
          print(f"live sitemap pages missing from the tree: {len(missing)}")
          print("\n".join(missing[:40]))
          sys.exit(1 if missing else 0)
          PY

      - name: Publish
        if: steps.gate.outputs.skip != 'true'
        working-directory: core
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 87f2dc2c8ff70d0d68099a12e06a5894
        run: bash scripts/deploy-oj-landing.sh
