name: old-site-wayback
# One-off: fetch the old course site pages the Wayback Machine still holds, from a runner address
# the Archive has not rate limited. Started by hand; the result is a run artifact.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -I tools/old-site/wayback_pages.py tools/old-site/missing.txt out
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: old-site-pages
          path: out
          retention-days: 30
