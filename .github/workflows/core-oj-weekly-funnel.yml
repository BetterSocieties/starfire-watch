# Weekly OpsJuice funnel report to Slack. Plain computed numbers from the oj_events views,
# no model call, no paid service. Names the weakest funnel step, the best and worst template
# and trade (only when each has 10 or more sends), and says nothing on a quiet week.
# Bar: STATE/benchmarks/slack-alerts-2026-10-12.md in starfire-core (one screen, decisions first).
#
# Mondays 01:00 UTC. The script is scripts/oj-weekly-funnel-report.py in starfire-core.
name: core-oj-weekly-funnel
on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: core-oj-weekly-funnel
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout starfire-core (the repository the scripts live in)
        uses: actions/checkout@v4
        with:
          repository: BetterSocieties/starfire-core
          token: ${{ secrets.GH_PAT }}
          path: core
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and post the weekly funnel report
        working-directory: core
        env:
          STARFIRE_VAULT_URL: https://starfire-vault.dark-wildflower-46d6.workers.dev
          STARFIRE_VAULT_BEARER: ${{ secrets.VAULT_BEARER }}
        run: |
          set -uo pipefail
          python3 scripts/oj-weekly-funnel-report.py --self-test
          scripts/with-vault-env.sh OJ_SUPABASE_URL OJ_SUPABASE_SERVICE_ROLE -- \
            python3 scripts/oj-weekly-funnel-report.py --post

      - name: Tell Slack the report job failed
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg t "core-oj-weekly-funnel failed. Run: $RUN_URL" '{channel: "#starfire-done", text: $t}' \
            | curl -sS --fail-with-body -X POST -H "Content-Type: application/json" -d @- \
              https://n8n.opsjuice.com/webhook/starfire-alert-relay
