# THIS GUARD WATCHES THE FINISH CONTRACT MACHINERY: card selection
# (next-card.py, prioritize.py), claiming (claim-issue.py), closing the loop
# (close-the-loop.py), the finish gate and blocker prompt hooks, the cloud
# fire loop test, and the fire audit. Those 8 scripts are what every cloud
# tick relies on to pick a card, claim it, work it and prove it done. If any
# one of them breaks, every tick downstream silently degrades or stalls, and
# nobody notices until a card sits unclaimed or a false PASS ships.
#
# This job runs against BetterSocieties/starfire-core main every day at 05:30
# UTC, ahead of learning-daily, so a change that breaks any of the 8 self
# tests is red within 24 hours instead of being discovered mid incident.
#
# WHY THIS RUNS HERE AND NOT IN THE PRIVATE REPOSITORY: GitHub meters
# Actions minutes on PRIVATE repositories only, and starfire-core is
# private. This repository is PUBLIC, so its runners are free and
# unmetered. See .github/workflows/core-canon-drift.yml for the fuller
# account of that outage and why the pattern moved here first.
#
# WHY THE PUBLIC LOG CARRIES PASS OR FAIL ONLY: this repository's Actions
# logs are public, and a failing self test can print doctrine text, file
# paths or other detail that belongs to the private repository, not to a
# public log. Each step writes its own log file inside the private checkout
# and that file is pushed back to starfire-core. The summary below names
# only outcomes.
name: core-finish-contract-tests
on:
  schedule:
    - cron: "30 5 * * *"   # 05:30 UTC daily
  workflow_dispatch: {}
  # Run when the guard itself changes, so an edit to this file proves itself
  # immediately instead of waiting for the next scheduled run. The path
  # filter keeps this quiet: only a change to this exact file starts a run.
  push:
    paths:
      - ".github/workflows/core-finish-contract-tests.yml"

permissions:
  contents: read

concurrency:
  group: core-finish-contract-tests
  cancel-in-progress: true

jobs:
  finish-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout starfire-core (the repository being checked)
        uses: actions/checkout@v4
        with:
          repository: BetterSocieties/starfire-core
          token: ${{ secrets.GH_PAT }}
          path: core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Run every gate even if an earlier one fails, so one red gate does not
      # hide the others. Each records its own exit code; the summary step
      # reports every outcome.
      - name: Card selection self test
        id: nextcard
        if: always()
        working-directory: core
        run: |
          mkdir -p agent
          rc=0; python3 scripts/next-card.py --self-test > agent/finish-contract-nextcard.log 2>&1 || rc=$?
          echo "exit=$rc"; exit $rc

      - name: Prioritize self test
        id: prioritize
        if: always()
        working-directory: core
        run: |
          mkdir -p agent
          rc=0; python3 scripts/prioritize.py --self-test > agent/finish-contract-prioritize.log 2>&1 || rc=$?
          echo "exit=$rc"; exit $rc

      - name: Claim issue self test
        id: claim
        if: always()
        working-directory: core
        run: |
          mkdir -p agent
          rc=0; python3 scripts/claim-issue.py --self-test > agent/finish-contract-claim.log 2>&1 || rc=$?
          echo "exit=$rc"; exit $rc

      - name: Close the loop self test
        id: closeloop
        if: always()
        working-directory: core
        run: |
          mkdir -p agent
          rc=0; python3 scripts/close-the-loop.py --self-test > agent/finish-contract-closeloop.log 2>&1 || rc=$?
          echo "exit=$rc"; exit $rc

      - name: Goal finish gate hook self test
        id: finishgate
        if: always()
        working-directory: core
        run: |
          mkdir -p agent
          rc=0; python3 scripts/hooks/goal-finish-gate.py --self-test > agent/finish-contract-finishgate.log 2>&1 || rc=$?
          echo "exit=$rc"; exit $rc

      - name: Blocker research prompt hook self test
        id: blockerprompt
        if: always()
        working-directory: core
        run: |
          mkdir -p agent
          rc=0; python3 scripts/hooks/blocker-research-prompt.py --self-test > agent/finish-contract-blockerprompt.log 2>&1 || rc=$?
          echo "exit=$rc"; exit $rc

      - name: Cloud fire loop test
        id: cloudfireloop
        if: always()
        working-directory: core
        run: |
          mkdir -p agent
          rc=0; bash scripts/tests/test-cloud-fire-loop.sh > agent/finish-contract-cloudfireloop.log 2>&1 || rc=$?
          echo "exit=$rc"; exit $rc

      - name: Fire audit self test
        id: fireaudit
        if: always()
        working-directory: core
        run: |
          mkdir -p agent
          rc=0; python3 scripts/fire-audit.py --self-test > agent/finish-contract-fireaudit.log 2>&1 || rc=$?
          echo "exit=$rc"; exit $rc

      - name: Push the detail back to the private repository
        if: always()
        working-directory: core
        run: |
          git config user.name "starfire-finish-contract-tests"
          git config user.email "info@bettersocieties.world"
          git add agent/finish-contract-*
          if git diff --cached --quiet; then echo "no change in gate detail"; exit 0; fi
          git commit -m "finish-contract-tests: gate detail from public runner ${{ github.run_id }}"
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0 || { git fetch origin main && git rebase origin/main || git rebase --abort; }
          done
          echo "could not push gate detail; the verdict below still stands" >&2

      - name: Summary
        if: always()
        run: |
          {
            echo "| gate | result |"
            echo "|---|---|"
            echo "| next-card | ${{ steps.nextcard.outcome }} |"
            echo "| prioritize | ${{ steps.prioritize.outcome }} |"
            echo "| claim-issue | ${{ steps.claim.outcome }} |"
            echo "| close-the-loop | ${{ steps.closeloop.outcome }} |"
            echo "| goal-finish-gate | ${{ steps.finishgate.outcome }} |"
            echo "| blocker-research-prompt | ${{ steps.blockerprompt.outcome }} |"
            echo "| cloud-fire-loop | ${{ steps.cloudfireloop.outcome }} |"
            echo "| fire-audit | ${{ steps.fireaudit.outcome }} |"
            echo ""
            echo "Detail is in starfire-core at agent/finish-contract-*.log, deliberately not here."
          } >> "$GITHUB_STEP_SUMMARY"
