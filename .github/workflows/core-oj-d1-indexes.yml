# The D1 free tier allows 5,000,000 rows read and 100,000 rows written a day, and resets at 00:00 UTC.
# The index file ventures/opsjuice/d1-migration/d1-budget-indexes.sql in starfire-core was merged on
# 2026-10-29 but nothing ran it, so the live database lacked its indexes and the funnel report read
# about 266,000 rows every 3 hours. This job runs every hour at minute 7. CREATE INDEX writes one row per
# row indexed, so the script creates an index only when its table fits what is left of a 50,000-row
# write budget today; one that does not fit waits for a later hour (exit 0), one bigger than the whole
# budget fails the run (exit 3), and an index still missing after its CREATE fails it (exit 5).
# Exits 1 and 4 come from vault-get.py: the vault read failed, or its key is retired.
# The script runs only CREATE INDEX IF NOT EXISTS statements and refuses anything else (exit 2).
# Its output is index names, row counts and fixed reason lines only.

name: core-oj-d1-indexes
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: core-oj-d1-indexes
  cancel-in-progress: false

# The log is world readable: a failure tail prints only lines shaped like an error or a count.
env:
  SAFE_LINES: '^(Traceback [(]most recent call last[)]:|  File "([A-Za-z0-9_./-]+|<frozen [a-z_.]+>)", line [0-9]+(, in [A-Za-z0-9_<>.]+)?|[A-Za-z0-9_.]*(Error|Exception|Exit)(:.*)?|(error|fatal|warning)(:.*)?|exit=[0-9]+( gmaps scraper (failed|wrote no output|timed out after [0-9]+ s|returned 0 places for [0-9]+ queries)| bad depth)?|HTTP [0-9]{3}|D1 statements this run: [0-9]+|found=[0-9]+ written=[0-9]+ write_failed=[0-9]+ skipped=[0-9]+ dnc=[0-9]+|wrote [0-9]+ new businesses into the OpsJuice pool|read [0-9]+ rows carrying a fit and no verdict|read [0-9]+ queued rows after [A-Za-z0-9_-]*; [0-9]+ due a quote; skipped [0-9]+; (none|[a-z_]+ [0-9]+(, [a-z_]+ [0-9]+)*) [(]apply=(True|False)[)]|read [0-9]+ queued or unscreened rows after [A-Za-z0-9_-]*; [0-9]+ owed a screen; [0-9]+ held for the quote step [(]site read, quote, then screen[)]|end of the queued( and unscreened)? rows|refused: (--after-id must be a row id|--batch must be 1 to [0-9]+|this script reads only in bounded batches[.] Pass --batch N [(]1 to [0-9]+[)], and --after-id ROW_ID to continue[.] There is no full walk[.])|[{]"probed": [0-9]+, "verdicts": [{]("[a-z_]+": [0-9]+(, )?)*[}], "written": [0-9]+, "applied": (true|false)[}])$'
  SAFE_CUT: 's/^([A-Za-z0-9_.]*(Error|Exception|Exit)): (daily (read|write) budget reached|per-run write cap reached).*/\1 \3/; s/^([A-Za-z0-9_.]*(Error|Exception|Exit)):.*/\1/; s/^(error|fatal|warning):.*/\1/'

jobs:
  indexes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STARFIRE_VAULT_URL: https://starfire-vault.dark-wildflower-46d6.workers.dev
      STARFIRE_VAULT_BEARER: ${{ secrets.VAULT_BEARER }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout starfire-core (the repository the scripts live in)
        uses: actions/checkout@v4
        with:
          repository: BetterSocieties/starfire-core
          token: ${{ secrets.GH_PAT }}
          path: core
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply the D1 index file
        working-directory: core
        run: |
          set -uo pipefail
          rc=0
          python3 scripts/vault-get.py CLOUDFLARE_CODEMODE_MCP_TOKEN --into CLOUDFLARE_API_TOKEN -- \
            python3 scripts/oj-d1-apply-indexes.py --apply \
            > "$RUNNER_TEMP/indexes.log" 2>&1 || rc=$?
          echo "indexes exit=$rc"
          # index names and counts only
          grep -E '^(missing|created|deferred|too big|indexes):' "$RUNNER_TEMP/indexes.log" || true
          case "$rc" in
            0) ;;
            1) echo "indexes reason: the vault read failed (vault-get.py)" ;;
            2) echo "indexes reason: the index file was refused, or D1 or the usage check failed" ;;
            3) echo "indexes reason: an index's table is bigger than the whole daily write budget" ;;
            4) echo "indexes reason: the vault key is retired (vault-get.py)" ;;
            5) echo "indexes reason: an index is still missing after its CREATE ran" ;;
            *) echo "indexes reason: unexpected exit $rc" ;;
          esac
          if [ "$rc" -ne 0 ]; then
            tail -n 3 "$RUNNER_TEMP/indexes.log" | { grep -E "$SAFE_LINES" || true; } | sed -E "$SAFE_CUT"
            exit "$rc"
          fi
          grep -E '^indexes:' "$RUNNER_TEMP/indexes.log" >> "$GITHUB_STEP_SUMMARY" || true
